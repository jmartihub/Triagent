name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # Versiones exactas y hashes verificados (requirements-lock.txt); solo wheels, sin scripts de instalación.
      - run: pip install --only-binary :all: --require-hashes -r requirements-lock.txt
      - run: pytest -q
