# Ontología del dominio de Soporte TI universitario (Tooli / GLPI)
# Define clases, instancias, relaciones y competencias de resolución.

servicios_plataformas:
  teams:
    nombre: "Microsoft Teams"
    tipo: "Plataforma de Comunicación y Clases"
    criticidad_base: "Alta"
    grupo_responsable: "sistemas_academicos"
  banner:
    nombre: "Banner / Portal Estudiantil"
    tipo: "Sistema de Registro y Gestión Académica"
    criticidad_base: "Alta"
    grupo_responsable: "sistemas_academicos"
  red_wifi:
    nombre: "Infraestructura de Red y Wi-Fi Campus"
    tipo: "Red y Telecomunicaciones"
    criticidad_base: "Crítica"
    grupo_responsable: "infraestructura_redes"
  correo:
    nombre: "Correo Institucional (Exchange / Microsoft 365)"
    tipo: "Identidad y Comunicación"
    criticidad_base: "Media"
    grupo_responsable: "infraestructura_redes"
  pagos_linea:
    nombre: "Portal Transaccional PSE / Pasarela de Pago"
    tipo: "Financiero / Pasarela"
    criticidad_base: "Alta"
    grupo_responsable: "tesoreria_pagos"
  accesos_cuentas:
    nombre: "Directorio Activo y Autenticación Central"
    tipo: "Seguridad e Identidad"
    criticidad_base: "Alta"
    grupo_responsable: "infraestructura_redes"
  software_salas:
    nombre: "Software Especializado en Laboratorios"
    tipo: "Laboratorio y Software Local"
    criticidad_base: "Media"
    grupo_responsable: "soporte_salas_hardware"
  computadores_fisicos:
    nombre: "Hardware y Periféricos en Salas de Cómputo"
    tipo: "Hardware Local"
    criticidad_base: "Media"
    grupo_responsable: "soporte_salas_hardware"
  sala_virtual:
    nombre: "Entorno VDI / Escritorio Remoto Estudiantes"
    tipo: "Virtualización y Acceso Remoto"
    criticidad_base: "Alta"
    grupo_responsable: "soporte_salas_hardware"
  liquidacion_matricula:
    nombre: "Sistema de Liquidación y Facturación Académica"
    tipo: "Financiero Académico"
    criticidad_base: "Alta"
    grupo_responsable: "tesoreria_pagos"

grupos_soporte:
  mesa_ayuda_nivel_1:
    nombre: "Mesa de Ayuda - Nivel 1"
    descripcion: "Atención inicial, orientación general, consultas simples y recepción de dudas."
    escalamiento: "sistemas_academicos"
  sistemas_academicos:
    nombre: "Soporte de Sistemas Académicos"
    descripcion: "Especialistas en Banner, Teams, Aulas Virtuales y Registro de Asignaturas."
    escalamiento: "infraestructura_redes"
  infraestructura_redes:
    nombre: "Infraestructura, Redes y Telecomunicaciones"
    descripcion: "Especialistas en conectividad Wi-Fi, switches, cortafuegos, servidores y correo."
    escalamiento: "direccion_ti"
  soporte_salas_hardware:
    nombre: "Soporte de Salas de Cómputo y Hardware"
    descripcion: "Atención física a equipos de cómputo, licencias de laboratorio y salas virtuales."
    escalamiento: "infraestructura_redes"
  tesoreria_pagos:
    nombre: "Gestión Financiera y Pagos"
    descripcion: "Atención de pagos en línea, liquidaciones, descuentos y bloqueos financieros."
    escalamiento: "direccion_financiera"

