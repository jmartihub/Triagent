politicas_sla:
  Crítica:
    tiempo_max_resolucion_horas: 2.0
    tiempo_primera_respuesta_minutos: 15
    notificar_coordinador: true
    descripcion: "Interrupción de servicios críticos que bloquean actividades académicas o exámenes con plazo inmediato."
  Alta:
    tiempo_max_resolucion_horas: 8.0
    tiempo_primera_respuesta_minutos: 60
    notificar_coordinador: false
    descripcion: "Problemas que bloquean el trabajo individual con plazos cercanos y sin alternativa viable."
  Media:
    tiempo_max_resolucion_horas: 24.0
    tiempo_primera_respuesta_minutos: 240
    notificar_coordinador: false
    descripcion: "Fallas que cuentan con alternativa temporal o consultas con plazos cercanos."
  Baja:
    tiempo_max_resolucion_horas: 72.0
    tiempo_primera_respuesta_minutos: 480
    notificar_coordinador: false
    descripcion: "Dudas informativas o fallas menores que no impiden continuar las actividades."

