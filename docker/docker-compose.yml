services:
  mariadb:
    image: mariadb:10.11@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    container_name: glpi_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_ti
      MYSQL_DATABASE: glpi_db
      MYSQL_USER: glpi_user
      MYSQL_PASSWORD: glpi_secure_password
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - glpi_network

  glpi:
    # Imagen fijada por digest; la versión de GLPI que descarga se fija con VERSION_GLPI.
    image: diouxx/glpi@sha256:9ca43af63ddcb7e1c9b7b452a50b8204980ac549526dee1c00296793bfe7789f
    container_name: glpi_app
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8080:80"
    environment:
      TIMEZONE: "America/Bogota"
      VERSION_GLPI: "12.0.2"
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: glpi_db
      MARIADB_USER: glpi_user
      MARIADB_PASSWORD: glpi_secure_password
    volumes:
      - glpi_data:/var/www/html/glpi
    networks:
      - glpi_network

volumes:
  glpi_db_data:
  glpi_data:

networks:
  glpi_network:
    driver: bridge
